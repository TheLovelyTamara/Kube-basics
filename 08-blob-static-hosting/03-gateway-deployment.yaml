apiVersion: apps/v1
kind: Deployment
metadata:
  name: blob-cdn-gateway-deployment
  namespace: lab
  labels:
    app: blob-cdn-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blob-cdn-gateway
  template:
    metadata:
      labels:
        app: blob-cdn-gateway
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: gateway-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: gateway-conf
        configMap:
          name: cdn-gateway-config
