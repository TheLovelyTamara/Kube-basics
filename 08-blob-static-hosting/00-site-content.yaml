apiVersion: v1
kind: ConfigMap
metadata:
  name: blob-site-source
  namespace: lab
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Blob Storage Static Web Hosting</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="style.css">
    </head>
    <body>
      <div class="blob-glow"></div>
      <div class="container">
        <header>
          <div class="brand">
            <div class="bucket-icon">🪣</div>
            <div>
              <h1>S3 Blob-Hosted Frontend</h1>
              <p class="subtitle">HTML, CSS & JS stored in MinIO S3 Object Storage • Proxied by Edge Gateway</p>
            </div>
          </div>
          <div class="storage-badge">
            <span class="live-dot"></span> Source: <strong>s3://web-bucket/</strong>
          </div>
        </header>

        <div class="card banner-card">
          <div class="banner-title">☁️ How This Works (The "CloudFront + S3" Pattern)</div>
          <p class="banner-text">
            This entire web page has <strong>zero files on any local disk or container</strong>. 
            When your browser asked for <code>index.html</code>, the Edge Gateway pulled the object directly out of our 
            <strong>MinIO S3 bucket (web-bucket)</strong> in real time.
          </p>
          <div class="flow-steps">
            <div class="f-step">
              <span class="f-badge">1</span>
              <strong>MinIO Bucket</strong>
              <span>Stores static objects</span>
            </div>
            <div class="f-arrow">⟶</div>
            <div class="f-step">
              <span class="f-badge">2</span>
              <strong>Edge Gateway</strong>
              <span>Proxies S3 & API</span>
            </div>
            <div class="f-arrow">⟶</div>
            <div class="f-step">
              <span class="f-badge">3</span>
              <strong>Browser</strong>
              <span>Renders SPA</span>
            </div>
          </div>
        </div>

        <div class="grid">
          <!-- Backend API Connection -->
          <div class="card">
            <div class="card-title">🔌 Connected Backend REST API</div>
            <p class="card-desc">Even though the site is in S3, it still communicates with our cluster API!</p>
            <div class="api-status" id="apiStatus">Connecting to /api/system...</div>
            <div class="api-details" id="apiDetails"></div>
          </div>

          <!-- Dynamic Live Update Demo -->
          <div class="card">
            <div class="card-title">🚀 Instant Deployments Without Pod Restarts</div>
            <p class="card-desc">
              In traditional K8s, updating a site requires building a new Docker image or editing YAML. 
              With Blob Storage hosting, you just upload a new file to MinIO:
            </p>
            <div class="code-box">
              <code>aws s3 cp ./index.html s3://web-bucket/ --endpoint-url=http://minio:9000</code>
            </div>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 1rem;">
              The changes appear instantly for visitors worldwide without triggering a single Pod rollout!
            </p>
          </div>
        </div>
      </div>
      <script src="app.js"></script>
    </body>
    </html>

  style.css: |
    :root {
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --accent: #ec4899;
      --success: #10b981;
      --text: #f9fafb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      position: relative;
    }

    .blob-glow {
      position: absolute;
      top: -100px;
      right: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, rgba(56, 189, 248, 0.08) 50%, transparent 70%);
      pointer-events: none;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .bucket-icon {
      font-size: 2.5rem;
      background: rgba(236, 72, 153, 0.1);
      border: 1px solid rgba(236, 72, 153, 0.25);
      border-radius: 16px;
      padding: 0.5rem 0.8rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #ec4899 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .storage-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #6ee7b7;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 1.5rem;
    }

    .banner-card {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.6) 0%, rgba(17, 24, 39, 0.8) 100%);
      border: 1px solid rgba(129, 140, 248, 0.2);
    }

    .banner-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #e0e7ff;
      margin-bottom: 0.5rem;
    }

    .banner-text {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .flow-steps {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-top: 1.25rem;
      gap: 0.5rem;
    }

    .f-step {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      font-size: 0.85rem;
    }

    .f-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #818cf8;
      color: #000;
      font-weight: 700;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.3rem auto;
    }

    .f-arrow { color: var(--muted); font-size: 1.2rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 1.5rem;
    }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .api-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--primary);
    }

    .api-details {
      margin-top: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .code-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #f472b6;
      overflow-x: auto;
    }

  app.js: |
    async function loadApi() {
      const statusDiv = document.getElementById('apiStatus');
      const detailsDiv = document.getElementById('apiDetails');
      try {
        const resp = await fetch('/api/system');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        statusDiv.innerHTML = `<span style="color: #34d399;">✓ Connected to Backend API</span>`;
        detailsDiv.innerHTML = `
          <div><strong>API Pod:</strong> ${data.pod_name}</div>
          <div><strong>Python Version:</strong> ${data.python_version}</div>
          <div><strong>Uptime:</strong> ${Math.floor(data.uptime_seconds)} seconds</div>
        `;
      } catch (err) {
        statusDiv.innerHTML = `<span style="color: #f87171;">✗ API Offline: ${err.message}</span>`;
      }
    }

    loadApi();
    setInterval(loadApi, 3000);
