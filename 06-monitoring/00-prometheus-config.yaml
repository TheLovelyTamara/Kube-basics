apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'demo-app'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['demo-app-service.lab.svc.cluster.local:8000']

      - job_name: 'minio'
        metrics_path: '/minio/v2/metrics/cluster'
        static_configs:
          - targets: ['minio-service.lab.svc.cluster.local:9000']
