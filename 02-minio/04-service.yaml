apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: lab
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
  # When a service has more than one port, each port MUST have a unique name!
  - name: s3-api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
