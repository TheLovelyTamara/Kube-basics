apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap-deployment
  namespace: lab
  labels:
    app: ldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  template:
    metadata:
      labels:
        app: ldap
    spec:
      containers:
      - name: ldap
        image: lldap/lldap:stable
        ports:
        - containerPort: 3890
          name: ldap
        - containerPort: 17170
          name: http
        envFrom:
        - configMapRef:
            name: ldap-config
        - secretRef:
            name: ldap-secret
        volumeMounts:
        - name: ldap-storage
          mountPath: /data
        # Probes using HTTP check on the administration web port
        livenessProbe:
          httpGet:
            path: /
            port: 17170
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 17170
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: ldap-storage
        persistentVolumeClaim:
          claimName: ldap-pvc
