apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-deployment
  namespace: lab
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:latest
        args:
        - "server"
        - "-dev"
        ports:
        - containerPort: 8200
          name: http-vault
        envFrom:
        - configMapRef:
            name: vault-config
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        # Health Probes: Vault responds 200 on /v1/sys/health when unsealed and active
        livenessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
