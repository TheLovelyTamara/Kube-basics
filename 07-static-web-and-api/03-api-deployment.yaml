apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-deployment
  namespace: lab
  labels:
    app: backend-api
spec:
  # 2 backend replicas to demonstrate independent API scaling & load balancing
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: api
        image: python:3.11-slim
        command: ["python", "-u", "/app/server.py"]
        ports:
        - containerPort: 5000
          name: http
        volumeMounts:
        - name: code-volume
          mountPath: /app/server.py
          subPath: server.py
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: code-volume
        configMap:
          name: backend-api-code
