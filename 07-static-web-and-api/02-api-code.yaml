apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-api-code
  namespace: lab
data:
  server.py: |
    import json
    import os
    import platform
    import socket
    import sys
    import time
    from http.server import HTTPServer, BaseHTTPRequestHandler

    START_TIME = time.time()
    HOSTNAME = socket.gethostname()
    ITEMS = [
        {"id": 1, "name": "Kubernetes Control Plane", "category": "Core"},
        {"id": 2, "name": "CoreDNS Service Discovery", "category": "Networking"},
        {"id": 3, "name": "Local Storage Provisioner", "category": "Storage"}
    ]

    class ApiHandler(BaseHTTPRequestHandler):
        def _send_json(self, data, status=200):
            self.send_response(status)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Access-Control-Allow-Origin', '*')
            self.send_header('Access-Control-Allow-Methods', 'GET, POST, OPTIONS')
            self.send_header('Access-Control-Allow-Headers', 'Content-Type')
            self.end_headers()
            self.wfile.write(json.dumps(data).encode('utf-8'))

        def do_OPTIONS(self):
            self._send_json({"status": "ok"})

        def do_GET(self):
            if self.path == '/api/health':
                self._send_json({"status": "healthy", "pod": HOSTNAME})
            elif self.path == '/api/system':
                self._send_json({
                    "pod_name": HOSTNAME,
                    "python_version": platform.python_version(),
                    "cpu_count": os.cpu_count(),
                    "uptime_seconds": time.time() - START_TIME,
                    "platform": platform.platform()
                })
            elif self.path == '/api/items':
                self._send_json(ITEMS)
            else:
                self._send_json({"error": "Endpoint not found", "path": self.path}, status=404)

        def do_POST(self):
            if self.path == '/api/items':
                content_length = int(self.headers.get('Content-Length', 0))
                body = self.rfile.read(content_length)
                try:
                    payload = json.loads(body.decode('utf-8'))
                    new_item = {
                        "id": len(ITEMS) + 1,
                        "name": payload.get("name", "Untitled Item"),
                        "category": payload.get("category", "General")
                    }
                    ITEMS.append(new_item)
                    self._send_json(new_item, status=201)
                except Exception as e:
                    self._send_json({"error": str(e)}, status=400)
            else:
                self._send_json({"error": "Endpoint not found"}, status=404)

    if __name__ == '__main__':
        port = int(os.environ.get('PORT', 5000))
        server = HTTPServer(('0.0.0.0', port), ApiHandler)
        print(f"Backend API listening on 0.0.0.0:{port} in pod {HOSTNAME}")
        server.serve_forever()
