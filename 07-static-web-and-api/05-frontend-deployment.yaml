apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web-deployment
  namespace: lab
  labels:
    app: frontend-web
spec:
  # 2 frontend replicas serving static assets with sub-millisecond latency
  replicas: 2
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        # Mount the custom reverse-proxy config
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        # Mount the static web assets (HTML, CSS, JS)
        - name: static-files
          mountPath: /usr/share/nginx/html
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-reverse-proxy-config
      - name: static-files
        configMap:
          name: static-web-content
