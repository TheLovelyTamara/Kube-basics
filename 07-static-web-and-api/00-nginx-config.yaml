apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-reverse-proxy-config
  namespace: lab
data:
  default.conf: |
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # 1. Serve Static Web Assets (HTML, CSS, JS)
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Reverse Proxy all /api/ requests to the internal Kubernetes Backend API Service!
        location /api/ {
            # Use CoreDNS service discovery inside the cluster
            proxy_pass http://backend-api-service.lab.svc.cluster.local:5000;
            
            # Pass original client headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for fast real-time API responses
            proxy_buffering off;
        }

        # Custom error page
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
